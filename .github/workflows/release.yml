name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  linux:
    # Ubuntu 22.04 has an older glibc (2.35), so the binary runs on most current distributions.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # for the parity test against researcher.py
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked --release
      - name: Check the tag matches Cargo.toml
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - run: cargo build --locked --release
      - name: Package
        run: |
          mkdir dist
          name="researcher-$GITHUB_REF_NAME-x86_64-linux"
          cp target/release/researcher "dist/$name"
          cd dist && sha256sum "$name" > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "The Researcher $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
